name: Bug
description: Reportar un fallo reproducible
labels: [bug]
body:
  - type: markdown
    attributes:
      value: |
        Gracias por reportar. No incluyas secretos (API keys, tokens, `.env`).
        Para vulnerabilidades usa SECURITY.md, no un issue público.
  - type: textarea
    id: descripcion
    attributes:
      label: Descripción
      description: ¿Qué ocurre y qué esperabas que ocurriera?
    validations:
      required: true
  - type: textarea
    id: pasos
    attributes:
      label: Pasos para reproducir
      placeholder: |
        1. Ir a ...
        2. Crear ...
        3. Ver error ...
    validations:
      required: true
  - type: dropdown
    id: entorno
    attributes:
      label: Entorno
      options:
        - Docker Compose
        - Local (pnpm dev)
        - Otro
    validations:
      required: true
  - type: input
    id: version
    attributes:
      label: Versión o commit
      placeholder: v0.1.0 / abc1234
  - type: textarea
    id: logs
    attributes:
      label: Logs o capturas
      description: Consola del navegador, salida de la API/worker o capturas.
      render: shell
  - type: checkboxes
    id: comprobaciones
    attributes:
      label: Comprobaciones
      options:
        - label: He revisado que no incluyo secretos.
          required: true
        - label: He buscado un issue duplicado.
          required: true
